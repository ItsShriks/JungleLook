# Self-contained demo on synthetic forest plots (generated by `junglelook demo`).
# Small enough to train on a laptop CPU in a few minutes.
name: demo

data:
  inputs: [work/demo/plot_a.ply]        # unlabelled training plot
  voxel_size: 0.03

features:
  scales: [10, 30]

pseudolabel:
  classes: [ground, stump, other]
  stump:                                 # synthetic stumps are smaller than the Field-D ones
    diameter: [0.2, 1.5]
    min_points: 50

# Ground-truth stumps of the training plot, used only to report pseudo-label quality.
reference:
  classes: [not_stump, stump]
  default_class: not_stump
  class_map: {ground: not_stump, other: not_stump, stump: stump}
  sources:
    - {path: work/demo/plot_a_stumps/*.ply, class: stump, radius: 0.03, instances: true}

split: {tile_size: 10.0, ratios: [0.7, 0.15, 0.15], seed: 0}

model:
  name: pointnet

train:
  block_size: 6.0
  num_points: 2048
  batch_size: 8
  epochs: 8
  samples_per_epoch: 240
  patience: 8
  device: auto
