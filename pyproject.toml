[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "junglelook"
version = "0.1.0"
description = "Label-free forest point cloud segmentation: geometric features, pseudo-labels and PointNet / PointNet++"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Shrikar Nakhye" }]
keywords = ["point cloud", "lidar", "forestry", "segmentation", "pointnet", "pointnet++", "tree stumps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
las = ["laspy[lazrs]>=2.5"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
junglelook = "junglelook.__main__:main"

[tool.setuptools.packages.find]
include = ["junglelook*"]

[tool.setuptools.package-data]
junglelook = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]
